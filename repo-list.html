<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repositories - OneView Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css?v=v1.1.56">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <script src="js/access-control.js?v=v1.1.56"></script>
</head>
<body>
    <div class="global-header">
        <div class="title-container">
            <h1 id="project-title">Repositories</h1>
            <p class="rd-breadcrumb">
                <a href="projects.html?dashboard=repo">← Back to Projects</a>
                <span aria-hidden="true">·</span>
                <a href="index.html">🏠 Home</a>
                <span aria-hidden="true">·</span>
                <a href="ai-insights.html" class="ai-nav-link">✨ AI Insights</a>
            </p>
        </div>
        <div class="brand-pill">SECUREOPS</div>
    </div>

    <div id="rd-kpis" class="rd-kpi-grid" style="display: none;"></div>

    <div class="card">
        <div class="card-header">
            <h2 id="rd-list-heading">Repositories</h2>
            <span id="rd-updated" class="rd-updated"></span>
        </div>

        <p id="loading-message">Loading repositories...</p>

        <div id="rd-toolbar" class="pr-toolbar" style="display: none;">
            <div class="pr-toolbar-field pr-toolbar-search">
                <label for="rd-search">Search repositories</label>
                <div class="pr-input-wrap">
                    <span class="pr-input-icon">🔍</span>
                    <input type="text" id="rd-search" autocomplete="off" placeholder="Name, description or topic" />
                </div>
            </div>
            <div class="pr-toolbar-field">
                <label for="rd-language">Language</label>
                <select id="rd-language"><option value="all">All languages</option></select>
            </div>
            <div class="pr-toolbar-field">
                <label for="rd-visibility">Visibility</label>
                <select id="rd-visibility">
                    <option value="all">All</option>
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                    <option value="internal">Internal</option>
                    <option value="archived">Archived</option>
                </select>
            </div>
            <div class="pr-toolbar-field">
                <label for="rd-sort">Sort by</label>
                <select id="rd-sort">
                    <option value="pushed">Last push</option>
                    <option value="name">Name</option>
                    <option value="stars">Stars</option>
                    <option value="alerts">Security alerts</option>
                </select>
            </div>
            <div class="pr-toolbar-field pr-toolbar-actions">
                <button type="button" id="rd-clear" class="pr-btn-clear">Clear</button>
            </div>
        </div>

        <div id="rd-results-info" class="pr-results-info" style="display: none;"></div>
        <div id="rd-list"></div>
    </div>

    <div id="site-footer"></div>

    <script src="js/repo-common.js?v=v1.1.56"></script>
    <script src="js/repo-list.js?v=v1.1.56"></script>
    <script src="js/footer.js"></script>
</body>
</html>
