<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR List - NetSec Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css?v=20260709">
</head>
<body>
    <div class="global-header">
        <div class="title-container">
            <h1 id="project-title">Loading...</h1>
            <p style="font-size: 0.9rem; opacity: 0.8; margin-top: 0.5rem;">
                <a href="index.html" style="color: var(--cisco-blue); text-decoration: none;">← Back to Projects</a>
            </p>
        </div>
        <img src="img/cisco-logo.png" alt="Cisco Logo" class="logo" />
    </div>

    <div id="pr-list-container" class="card">
        <div class="card-header">
            <h2>Open Pull Requests</h2>
            <div style="display:flex;align-items:center;gap:1rem;">
                <a id="overview-link" href="pr-overview.html" class="pr-overview-link">📊 PR Overview</a>
                <span id="pr-count-badge" class="status-badge status-inprogress-bg">Loading...</span>
            </div>
        </div>
        <p id="loading-message">Loading pull requests...</p>

        <!-- Toolbar: search / sort / date range -->
        <div id="pr-toolbar" class="pr-toolbar" style="display: none;">
            <div class="pr-toolbar-field pr-toolbar-search">
                <label for="pr-search">Search by PR #</label>
                <div class="pr-input-wrap">
                    <span class="pr-input-icon">🔍</span>
                    <input type="text" id="pr-search" inputmode="numeric" autocomplete="off"
                           placeholder="e.g. 1263" />
                </div>
            </div>

            <div class="pr-toolbar-field">
                <label for="pr-author">Search by author</label>
                <div class="pr-input-wrap">
                    <span class="pr-input-icon">🔍</span>
                    <input type="text" id="pr-author" autocomplete="off"
                           placeholder="e.g. bbenny" />
                </div>
            </div>

            <div class="pr-toolbar-field">
                <label for="pr-date-from">Updated from</label>
                <input type="date" id="pr-date-from" />
            </div>

            <div class="pr-toolbar-field">
                <label for="pr-date-to">Updated to</label>
                <input type="date" id="pr-date-to" />
            </div>

            <div class="pr-toolbar-field">
                <label for="pr-type-filter">PR type</label>
                <select id="pr-type-filter">
                    <option value="all">All PRs</option>
                    <option value="waterfall">Waterfall PRs</option>
                    <option value="non-waterfall">Non-waterfall PRs</option>
                </select>
            </div>

            <div class="pr-toolbar-field">
                <label for="pr-status-sort">Sort by status</label>
                <select id="pr-status-sort">
                    <option value="updated">Latest updated</option>
                    <option value="approved">Approved PRs first</option>
                    <option value="closed">Closed PRs first</option>
                    <option value="other">Other statuses first</option>
                </select>
            </div>

            <div class="pr-toolbar-field pr-toolbar-actions">
                <button type="button" id="pr-clear-filters" class="pr-btn-clear">Clear</button>
            </div>
        </div>

        <div id="pr-results-info" class="pr-results-info" style="display: none;"></div>

        <div id="pr-list-content" style="display: none;">
            <!-- PR list will be populated here -->
        </div>

        <div id="pr-pagination" class="pr-pagination" style="display: none;">
            <!-- Pagination controls -->
        </div>
    </div>

    <footer id="dashboard-footer">
        NetSec Dashboard
    </footer>

    <script src="js/pr-list.js?v=20260709b"></script>
</body>
</html>
