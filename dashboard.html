<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneView Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <script src="js/access-control.js?v=v2.1.7"></script>
</head>
<body>
    <div class="global-header">
        <div class="title-container">
            <h1 id="dashboard-title">OneView Dashboard</h1>
            <p id="project-subtitle" style="font-size: 0.9rem; opacity: 0.8; margin-top: 0.5rem;"></p>
        </div>
        <div class="dashboard-actions" style="display: flex; align-items: center; gap: 1rem;">
            <button id="download-dashboard-pdf" class="btn no-print" type="button" disabled title="Dashboard data is still loading">⬇️ Download PDF</button>
            <a href="index.html" class="btn" style="text-decoration: none; padding: 0.5rem 1rem; font-size: 0.9rem;">🏠 Home</a>
            <div class="brand-pill">SECUREOPS</div>
        </div>
    </div>

    <div id="pr-details-container" class="card">
        <div class="card-header">
            </div>
        <p>Loading PR details...</p>
    </div>

    <div id="scorecard-container"></div>

    <div class="block" id="dashboard">
        </div>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/dashboard.js?v=v2.1.7"></script>
    <script src="js/footer.js"></script>
</body>
</html>
