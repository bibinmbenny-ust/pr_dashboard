name: Check CI Status

on:
  workflow_dispatch: # Manual trigger only

jobs:
  check-ci-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Set GitHub Token
        id: vault_auth
        run: |
          echo "GH_TOKEN=${{ secrets.FXOS_PAT }}" >> $GITHUB_ENV
          echo "✅ GitHub token loaded from Actions secret"

      - name: Get All Open PRs from FXOS
        id: get-prs
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROJECT_NAME="FXOS"
          REPO_NAME="cisco-sbg-emu/netsec-fxos"
          
          echo "Fetching all open PRs from $REPO_NAME"
          
          # First, verify we can access the repository
          if ! gh api repos/$REPO_NAME > /dev/null 2>&1; then
            echo "⚠️ WARNING: Cannot access repository $REPO_NAME"
            echo "[]" > /tmp/empty-prs.json
            echo "pr_count=0" >> $GITHUB_OUTPUT
            mkdir -p pr-reports/$PROJECT_NAME
            echo "[]" > pr-reports/$PROJECT_NAME/pr-list.json
            exit 0
          fi
          
          # Testing mode: only process PRs targeting the specific base branch
          TEST_BRANCH="feature/pr_dashboard_source"
          echo "⚠️ Testing mode: filtering to PRs targeting base branch: $TEST_BRANCH"

          # Get all open pull requests (filtered to PRs whose target/base is TEST_BRANCH)
          PRS_JSON=$(gh api repos/$REPO_NAME/pulls \
            --jq "[.[] | select(.base.ref == \"$TEST_BRANCH\") | {
              number: .number,
              title: .title,
              state: .state,
              author: .user.login,
              created_at: .created_at,
              updated_at: .updated_at,
              head_branch: .head.ref,
              head_sha: .head.sha,
              base_branch: .base.ref,
              html_url: .html_url,
              draft: .draft,
              mergeable_state: .mergeable_state,
              labels: [.labels[].name]
            }]")
          
          echo "Found PRs:"
          echo "$PRS_JSON" | jq .
          
          # Fetch CI status for each PR
          PR_COUNT=$(echo "$PRS_JSON" | jq 'length')
          ENRICHED_PRS="[]"
          
          for i in $(seq 0 $((PR_COUNT - 1))); do
            PR=$(echo "$PRS_JSON" | jq ".[$i]")
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            HEAD_SHA=$(echo "$PR" | jq -r '.head_sha')
            
            echo "Fetching CI status for PR #$PR_NUMBER (SHA: $HEAD_SHA)"
            
            # Get commit status
            STATUS_RESPONSE=$(gh api repos/$REPO_NAME/commits/$HEAD_SHA/status || echo '{}')
            CI_STATE=$(echo "$STATUS_RESPONSE" | jq -r '.state // "unknown"')
            
            # Get check runs (GitHub Actions) and determine overall status
            CHECKS_RESPONSE=$(gh api repos/$REPO_NAME/commits/$HEAD_SHA/check-runs || echo '{"check_runs":[]}')
            
            # Check if any check run failed or is in error state
            HAS_FAILURE=$(echo "$CHECKS_RESPONSE" | jq -r '[.check_runs[].conclusion] | any(. == "failure" or . == "error")')
            HAS_PENDING=$(echo "$CHECKS_RESPONSE" | jq -r '[.check_runs[].status] | any(. == "queued" or . == "in_progress")')
            
            # Determine overall check conclusion
            if [ "$HAS_FAILURE" = "true" ]; then
              CHECK_CONCLUSION="failure"
            elif [ "$HAS_PENDING" = "true" ]; then
              CHECK_CONCLUSION="pending"
            else
              CHECK_CONCLUSION=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[0].conclusion // "none"')
            fi
            
            # Overall check status
            CHECK_STATUS=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[0].status // "none"')
            
            # Determine final CI status (prefer commit status, but also consider checks)
            FINAL_STATUS="$CI_STATE"
            if [ "$CI_STATE" = "success" ] && [ "$CHECK_CONCLUSION" = "failure" ]; then
              FINAL_STATUS="failure"
            fi
            
            AI_SUGGESTION=""

            # ── Generate dashboard_<PR>.json ──────────────────────────────
            PR_TITLE=$(echo "$PR" | jq -r '.title')
            PR_AUTHOR=$(echo "$PR" | jq -r '.author')
            PR_CREATED=$(echo "$PR" | jq -r '.created_at')
            PR_UPDATED=$(echo "$PR" | jq -r '.updated_at')
            PR_HEAD_BRANCH=$(echo "$PR" | jq -r '.head_branch')
            PR_BASE_BRANCH=$(echo "$PR" | jq -r '.base_branch')

            # Extra PR detail: file counts, additions, deletions, merged flag
            PR_DETAIL=$(gh api repos/$REPO_NAME/pulls/$PR_NUMBER || echo '{}')
            CHANGED_FILES_COUNT=$(echo "$PR_DETAIL" | jq '.changed_files // 0')
            ADDITIONS=$(echo "$PR_DETAIL" | jq '.additions // 0')
            DELETIONS=$(echo "$PR_DETAIL" | jq '.deletions // 0')
            MERGED=$(echo "$PR_DETAIL" | jq '.merged // false')

            # Changed files with diff patches
            FILES_RESP=$(gh api repos/$REPO_NAME/pulls/$PR_NUMBER/files || echo '[]')
            CHANGED_FILES_DETAILS=$(echo "$FILES_RESP" | jq '[.[] | {
              file_name: .filename,
              status: .status,
              additions: .additions,
              deletions: .deletions,
              changes: .changes,
              patch: (.patch // "")
            }]')

            # Build per-module metrics from check runs
            MODULE_METRICS="{}"
            FAILED_STAGES=""
            TOTAL_FAILURES=0
            DASH_ERRORS="[]"
            DASH_ERROR_MSG=""
            RUN_COUNT=$(echo "$CHECKS_RESPONSE" | jq '.check_runs | length')
            CI_START_TIME=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[0].started_at // ""')
            CI_COMPLETED_TIME=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[0].completed_at // ""')
            JENKINS_BUILD_URL="https://engci-private-rtp.cisco.com/jenkins/firepower-precommit-asa-fxos/job/Precommit/job/FXOS/job/FXOS-GIT/job/Precommit-BAZEL/job/PR-${PR_NUMBER}/"
            JENKINS_BUILD_NUMBER=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[0].external_id // "N/A"')

            if [ "$RUN_COUNT" -gt 0 ]; then
              for j in $(seq 0 $((RUN_COUNT - 1))); do
                RUN=$(echo "$CHECKS_RESPONSE" | jq ".check_runs[$j]")
                RUN_NAME=$(echo "$RUN" | jq -r '.name')
                RUN_CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // "pending"')
                RUN_URL=$(echo "$RUN" | jq -r '.details_url // ""')
                RUN_TITLE=$(echo "$RUN" | jq -r '.output.title // ""')

                if [ "$RUN_CONCLUSION" = "success" ]; then
                  BUILD_STATUS="SUCCESS"
                elif [ "$RUN_CONCLUSION" = "failure" ] || [ "$RUN_CONCLUSION" = "error" ]; then
                  BUILD_STATUS="FAILURE"
                  TOTAL_FAILURES=$((TOTAL_FAILURES + 1))
                  FAILED_STAGES="${FAILED_STAGES:+$FAILED_STAGES, }$RUN_NAME"
                  ERR_ENTRY=$(jq -n \
                    --arg stage "$RUN_NAME" \
                    --arg url "$RUN_URL" \
                    --arg preview "$RUN_TITLE" \
                    '{stage: $stage, status: "FAILURE", error_log_url: $url, stage_type: "build", error_count: 0, error_preview: $preview, has_full_details: false}')
                  DASH_ERRORS=$(echo "$DASH_ERRORS" | jq --argjson e "$ERR_ENTRY" '. + [$e]')
                  if [ -n "$DASH_ERROR_MSG" ]; then
                    DASH_ERROR_MSG="$DASH_ERROR_MSG"$'\n'"❌ $RUN_NAME: $RUN_TITLE"
                  else
                    DASH_ERROR_MSG="❌ $RUN_NAME: $RUN_TITLE"
                  fi
                else
                  BUILD_STATUS="PENDING"
                fi

                MODULE_METRICS=$(echo "$MODULE_METRICS" | jq \
                  --arg k "${RUN_NAME}: Build Status" \
                  --arg v "$BUILD_STATUS" \
                  '. + {($k): $v}')
              done
            fi

            # Calculate CI duration in seconds
            if [ -n "$CI_START_TIME" ] && [ "$CI_START_TIME" != "null" ] && \
               [ -n "$CI_COMPLETED_TIME" ] && [ "$CI_COMPLETED_TIME" != "null" ]; then
              START_EPOCH=$(date -d "$CI_START_TIME" +%s 2>/dev/null || echo "0")
              END_EPOCH=$(date -d "$CI_COMPLETED_TIME" +%s 2>/dev/null || echo "0")
              CI_DURATION=$((END_EPOCH - START_EPOCH))
            else
              CI_DURATION=0
            fi

            # Assemble full dashboard entry
            DASH_ENTRY=$(echo "$MODULE_METRICS" | jq \
              --arg title "$PR_TITLE" \
              --argjson changed_files "$CHANGED_FILES_COUNT" \
              --argjson additions "$ADDITIONS" \
              --argjson deletions "$DELETIONS" \
              --argjson merged "$MERGED" \
              --arg pr_id "$PR_NUMBER" \
              --arg author "$PR_AUTHOR" \
              --arg created_at "$PR_CREATED" \
              --arg updated_at "$PR_UPDATED" \
              --arg pr_state "open" \
              --arg base_branch "$PR_BASE_BRANCH" \
              --arg head_branch "$PR_HEAD_BRANCH" \
              --arg commit_hash "$HEAD_SHA" \
              --arg ci_start_time "$CI_START_TIME" \
              --argjson ci_duration "$CI_DURATION" \
              --arg jenkins_build_number "$JENKINS_BUILD_NUMBER" \
              --arg jenkins_build_url "$JENKINS_BUILD_URL" \
              --argjson total_failures "$TOTAL_FAILURES" \
              --arg failed_stage "$FAILED_STAGES" \
              --argjson errors "$DASH_ERRORS" \
              --arg error_message "$DASH_ERROR_MSG" \
              --argjson changed_files_details "$CHANGED_FILES_DETAILS" \
              --arg ai_suggestion "" \
              '. + {
                title: $title,
                changed_files: $changed_files,
                additions: $additions,
                deletions: $deletions,
                merged: $merged,
                pr_id: $pr_id,
                author: $author,
                created_at: $created_at,
                updated_at: $updated_at,
                pr_state: $pr_state,
                base_branch: $base_branch,
                head_branch: $head_branch,
                commit_hash: $commit_hash,
                ci_start_time: $ci_start_time,
                ci_duration_seconds: $ci_duration,
                jenkins_build_number: $jenkins_build_number,
                jenkins_build_url: $jenkins_build_url,
                total_failures: $total_failures,
                failed_stage: $failed_stage,
                errors: $errors,
                error_message: $error_message,
                changed_files_details: $changed_files_details,
                ai_suggestion: $ai_suggestion
              }')

            # ── Revision-aware file write ──────────────────────────────────
            DASH_FILE="pr-reports/$PROJECT_NAME/dashboard_${PR_NUMBER}.json"
            if [ -f "$DASH_FILE" ]; then
              # Check if this commit SHA already has an entry
              SHA_EXISTS=$(jq --arg sha "$HEAD_SHA" '[.[] | select(.commit_hash == $sha)] | length' "$DASH_FILE")
              if [ "$SHA_EXISTS" -gt 0 ]; then
                # Same commit: update existing entry in place
                UPDATED=$(jq --arg sha "$HEAD_SHA" --argjson entry "$DASH_ENTRY" \
                  'map(if .commit_hash == $sha then $entry + {revision: .revision} else . end)' "$DASH_FILE")
                echo "$UPDATED" > "$DASH_FILE"
                echo "✅ Updated existing revision for SHA $HEAD_SHA in dashboard_${PR_NUMBER}.json"
              else
                # New commit: append as next revision
                NEXT_REV=$(jq '[.[].revision] | max + 1' "$DASH_FILE")
                DASH_ENTRY=$(echo "$DASH_ENTRY" | jq --argjson rev "$NEXT_REV" '. + {revision: $rev}')
                jq --argjson entry "$DASH_ENTRY" '. + [$entry]' "$DASH_FILE" > /tmp/dash_tmp.json
                mv /tmp/dash_tmp.json "$DASH_FILE"
                echo "✅ Appended revision $NEXT_REV for new commit $HEAD_SHA in dashboard_${PR_NUMBER}.json"
              fi
            else
              # First run: create file with revision 1
              echo "[$(echo "$DASH_ENTRY" | jq '. + {revision: 1}')]" > "$DASH_FILE"
              echo "✅ Created dashboard_${PR_NUMBER}.json (revision 1)"
            fi
            # ── End dashboard file ─────────────────────────────────────────

            # Combine PR data with CI status and AI suggestion
            ENRICHED_PR=$(echo "$PR" | jq \
              --arg ci_state "$FINAL_STATUS" \
              --arg check_status "$CHECK_STATUS" \
              --arg check_conclusion "$CHECK_CONCLUSION" \
              --arg ai_suggestion "$AI_SUGGESTION" \
              '. + {ci_status: $ci_state, check_status: $check_status, check_conclusion: $check_conclusion, ai_suggestion: $ai_suggestion}')
            
            ENRICHED_PRS=$(echo "$ENRICHED_PRS" | jq --argjson pr "$ENRICHED_PR" '. + [$pr]')
          done
          
          PRS_JSON="$ENRICHED_PRS"
          echo "Enriched PRs with CI status:"
          echo "$PRS_JSON" | jq .
          
          PR_COUNT=$(echo "$PRS_JSON" | jq 'length')
          echo "pr_count=$PR_COUNT" >> $GITHUB_OUTPUT
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          
          # Create a summary
          echo "## 📋 Open Pull Requests - $PROJECT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** $REPO_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Total Open PRs:** $PR_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "| PR # | Title | Author | Branch | CI Status | Check Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|--------|--------|-----------|--------------|" >> $GITHUB_STEP_SUMMARY
            
            echo "$PRS_JSON" | jq -r '.[] | "| [#\(.number)](\(.html_url)) | \(.title) | \(.author) | \(.head_branch) → \(.base_branch) | \(.ci_status) | \(.check_status) / \(.check_conclusion) |"' >> $GITHUB_STEP_SUMMARY
          else
            echo "No open pull requests found." >> $GITHUB_STEP_SUMMARY
          fi
          
          # Save PR list to project-specific directory
          mkdir -p pr-reports/$PROJECT_NAME
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "$PRS_JSON" | jq --arg ts "$TIMESTAMP" --arg project "$PROJECT_NAME" --arg repo "$REPO_NAME" \
            '{project: $project, timestamp: $ts, repository: $repo, total_count: length, pull_requests: .}' \
            > pr-reports/$PROJECT_NAME/pr-list.json

      - name: Display PR Summary for FXOS
        run: |
          PROJECT_NAME="${{ steps.get-prs.outputs.project_name }}"
          echo "=== $PROJECT_NAME ===" 
          echo "Total Open PRs: ${{ steps.get-prs.outputs.pr_count }}"
          
          if [ -f pr-reports/$PROJECT_NAME/pr-list.json ]; then
            echo "PR list saved to pr-reports/$PROJECT_NAME/pr-list.json"
          fi
          
      - name: Commit and push PR list for FXOS
        run: |
          PROJECT_NAME="${{ steps.get-prs.outputs.project_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pr-reports/$PROJECT_NAME/
          
          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Commit changes
          git commit -m "Update $PROJECT_NAME PR list [$(date -u +"%Y-%m-%d %H:%M:%S UTC")]"
          
          # Pull with rebase to avoid conflicts, then push
          git pull --rebase origin main || {
            echo "Rebase failed, trying to continue..."
            git rebase --abort
            git pull --no-rebase origin main
            git push origin main
            exit 0
          }
          
          git push origin main
