name: Check CI Status

on:
  schedule:
    # Run every 5 minutes (for testing)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

jobs:
  check-ci-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Authenticate with Vault
        id: vault_auth
        run: |
          VAULT_NAMESPACE="${{ secrets.VAULT_NAMESPACE }}"
          if [[ -z "$VAULT_NAMESPACE" ]]; then VAULT_NAMESPACE="firepower/git-emu"; fi
          
          # 1. Login (AppRole)
          echo "Authenticating with Vault..."
          AUTH_RESPONSE=$(curl -s -k -X POST \
            -H "Content-Type: application/json" \
            -H "X-Vault-Namespace: $VAULT_NAMESPACE" \
            -d "{ \"role_id\": \"${{ secrets.VAULT_ROLE_ID }}\", \"secret_id\": \"${{ secrets.VAULT_SECRET_ID }}\" }" \
            "${{ secrets.VAULT_URL }}/v1/auth/approle/login")
          
          if [[ $? -ne 0 ]]; then 
            echo "❌ Curl failed."
            exit 1
          fi
          
          VAULT_TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.auth.client_token // empty')
          
          if [[ -z "$VAULT_TOKEN" ]]; then 
            echo "❌ Auth Failed"
            exit 1
          fi
          
          echo "::add-mask::$VAULT_TOKEN"
          echo "✅ Vault authentication successful"
          
          # 2. Get GitHub PAT (Generic key retrieval)
          echo "Retrieving GitHub PAT from Vault..."
          SECRET_RESPONSE=$(curl -s -k -X GET \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "X-Vault-Namespace: $VAULT_NAMESPACE" \
            "${{ secrets.VAULT_URL }}/v1/test/data/snort3-kv")
          
          GH_PAT=$(echo "$SECRET_RESPONSE" | jq -r '.data.data | to_entries[0].value // empty')
          
          if [[ -z "$GH_PAT" ]]; then 
            echo "❌ PAT not found."
            exit 1
          fi
          
          echo "::add-mask::$GH_PAT"
          echo "✅ GitHub token retrieved from Vault"
          echo "GH_TOKEN=$GH_PAT" >> $GITHUB_ENV

      - name: Get All Open PRs from FXOS
        id: get-prs
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROJECT_NAME="FXOS"
          REPO_NAME="cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1"
          
          echo "Fetching all open PRs from $REPO_NAME"
          
          # First, verify we can access the repository
          if ! gh api repos/$REPO_NAME > /dev/null 2>&1; then
            echo "⚠️ WARNING: Cannot access repository $REPO_NAME"
            echo "[]" > /tmp/empty-prs.json
            echo "pr_count=0" >> $GITHUB_OUTPUT
            mkdir -p pr-reports/$PROJECT_NAME
            echo "[]" > pr-reports/$PROJECT_NAME/pr-list.json
            exit 0
          fi
          
          # Get all open pull requests
          PRS_JSON=$(gh api repos/$REPO_NAME/pulls \
            --jq '[.[] | {
              number: .number,
              title: .title,
              state: .state,
              author: .user.login,
              created_at: .created_at,
              updated_at: .updated_at,
              head_branch: .head.ref,
              head_sha: .head.sha,
              base_branch: .base.ref,
              html_url: .html_url,
              draft: .draft,
              mergeable_state: .mergeable_state,
              labels: [.labels[].name]
            }]')
          
          echo "Found PRs:"
          echo "$PRS_JSON" | jq .
          
          # Fetch CI status for each PR
          PR_COUNT=$(echo "$PRS_JSON" | jq 'length')
          ENRICHED_PRS="[]"
          
          for i in $(seq 0 $((PR_COUNT - 1))); do
            PR=$(echo "$PRS_JSON" | jq ".[$i]")
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            HEAD_SHA=$(echo "$PR" | jq -r '.head_sha')
            
            echo "Fetching CI status for PR #$PR_NUMBER (SHA: $HEAD_SHA)"
            
            # Get commit status
            STATUS_RESPONSE=$(gh api repos/$REPO_NAME/commits/$HEAD_SHA/status || echo '{}')
            CI_STATE=$(echo "$STATUS_RESPONSE" | jq -r '.state // "unknown"')
            
            # Get check runs (GitHub Actions) and determine overall status
            CHECKS_RESPONSE=$(gh api repos/$REPO_NAME/commits/$HEAD_SHA/check-runs || echo '{"check_runs":[]}')
            
            # Check if any check run failed or is in error state
            HAS_FAILURE=$(echo "$CHECKS_RESPONSE" | jq -r '[.check_runs[].conclusion] | any(. == "failure" or . == "error")')
            HAS_PENDING=$(echo "$CHECKS_RESPONSE" | jq -r '[.check_runs[].status] | any(. == "queued" or . == "in_progress")')
            
            # Determine overall check conclusion
            if [ "$HAS_FAILURE" = "true" ]; then
              CHECK_CONCLUSION="failure"
            elif [ "$HAS_PENDING" = "true" ]; then
              CHECK_CONCLUSION="pending"
            else
              CHECK_CONCLUSION=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[0].conclusion // "none"')
            fi
            
            # Overall check status
            CHECK_STATUS=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[0].status // "none"')
            
            # Determine final CI status (prefer commit status, but also consider checks)
            FINAL_STATUS="$CI_STATE"
            if [ "$CI_STATE" = "success" ] && [ "$CHECK_CONCLUSION" = "failure" ]; then
              FINAL_STATUS="failure"
            fi
            
            # AI Analysis for failed builds (using GitHub Models API)
            AI_SUGGESTION=""
            if [ "$FINAL_STATUS" = "failure" ]; then
              echo "🤖 Analyzing failure for PR #$PR_NUMBER with AI..."
              
              # Get PR details for context
              PR_TITLE=$(echo "$PR" | jq -r '.title')
              PR_BRANCH=$(echo "$PR" | jq -r '.head_branch')
              
              # Get recent commit messages for more context
              COMMIT_MESSAGES=$(gh api repos/$REPO_NAME/pulls/$PR_NUMBER/commits --jq '.[].commit.message' | head -5 || echo "No commit messages")
              
              # Get check run details for error messages
              CHECK_ERRORS=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[] | select(.conclusion == "failure") | .name + ": " + .output.title' 2>/dev/null || echo "No detailed error info")
              
              # Create AI prompt (single line to avoid YAML parsing issues)
              AI_PROMPT="Analyze this GitHub PR CI failure and provide actionable suggestions: PR Title: $PR_TITLE, Branch: $PR_BRANCH, Failed Checks: $CHECK_ERRORS, Recent Commits: $COMMIT_MESSAGES. Provide: 1. Likely root cause (2-3 sentences) 2. Specific fix suggestions (2-3 action items) 3. Prevention tips. Be concise and technical."

              # Call GitHub Models API (Copilot)
              # Note: Using GITHUB_TOKEN with GitHub Models endpoint
              AI_RESPONSE=$(curl -s -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"model\": \"gpt-4o\",
                  \"messages\": [{\"role\": \"user\", \"content\": $(echo "$AI_PROMPT" | jq -Rs .)}],
                  \"max_tokens\": 500
                }" \
                "https://models.inference.ai.azure.com/chat/completions" 2>/dev/null || echo '{"error": "AI service unavailable"}')
              
              AI_SUGGESTION=$(echo "$AI_RESPONSE" | jq -r '.choices[0].message.content // "AI analysis unavailable"' 2>/dev/null || echo "AI analysis unavailable")
              
              echo "AI Suggestion: $AI_SUGGESTION"
            fi
            
            # Combine PR data with CI status and AI suggestion
            ENRICHED_PR=$(echo "$PR" | jq \
              --arg ci_state "$FINAL_STATUS" \
              --arg check_status "$CHECK_STATUS" \
              --arg check_conclusion "$CHECK_CONCLUSION" \
              --arg ai_suggestion "$AI_SUGGESTION" \
              '. + {ci_status: $ci_state, check_status: $check_status, check_conclusion: $check_conclusion, ai_suggestion: $ai_suggestion}')
            
            ENRICHED_PRS=$(echo "$ENRICHED_PRS" | jq --argjson pr "$ENRICHED_PR" '. + [$pr]')
          done
          
          PRS_JSON="$ENRICHED_PRS"
          echo "Enriched PRs with CI status:"
          echo "$PRS_JSON" | jq .
          
          PR_COUNT=$(echo "$PRS_JSON" | jq 'length')
          echo "pr_count=$PR_COUNT" >> $GITHUB_OUTPUT
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          
          # Create a summary
          echo "## 📋 Open Pull Requests - $PROJECT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** $REPO_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Total Open PRs:** $PR_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "| PR # | Title | Author | Branch | CI Status | Check Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|--------|--------|-----------|--------------|" >> $GITHUB_STEP_SUMMARY
            
            echo "$PRS_JSON" | jq -r '.[] | "| [#\(.number)](\(.html_url)) | \(.title) | \(.author) | \(.head_branch) → \(.base_branch) | \(.ci_status) | \(.check_status) / \(.check_conclusion) |"' >> $GITHUB_STEP_SUMMARY
          else
            echo "No open pull requests found." >> $GITHUB_STEP_SUMMARY
          fi
          
          # Save PR list to project-specific directory
          mkdir -p pr-reports/$PROJECT_NAME
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "$PRS_JSON" | jq --arg ts "$TIMESTAMP" --arg project "$PROJECT_NAME" \
            '{project: $project, timestamp: $ts, repository: "'$REPO_NAME'", total_count: length, pull_requests: .}' \
            > pr-reports/$PROJECT_NAME/pr-list.json

      - name: Display PR Summary for FXOS
        run: |
          PROJECT_NAME="${{ steps.get-prs.outputs.project_name }}"
          echo "=== $PROJECT_NAME ===" 
          echo "Total Open PRs: ${{ steps.get-prs.outputs.pr_count }}"
          
          if [ -f pr-reports/$PROJECT_NAME/pr-list.json ]; then
            echo "PR list saved to pr-reports/$PROJECT_NAME/pr-list.json"
          fi

      - name: Add AI Suggestions to Dashboard Files
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROJECT_NAME="${{ steps.get-prs.outputs.project_name }}"
          echo "🤖 Adding AI suggestions to dashboard files for $PROJECT_NAME..."
          
          # Find all dashboard JSON files
          DASHBOARD_FILES=$(find pr-reports/$PROJECT_NAME -name "dashboard_*.json" 2>/dev/null || echo "")
          
          if [ -z "$DASHBOARD_FILES" ]; then
            echo "No dashboard files found to process"
            exit 0
          fi
          
          for DASHBOARD_FILE in $DASHBOARD_FILES; do
            echo "Processing: $DASHBOARD_FILE"
            
            # Create temporary file for modified JSON
            TEMP_FILE="${DASHBOARD_FILE}.tmp"
            
            # Process each revision in the dashboard file
            jq '[.[] | 
              if (.error_message and .error_message != "null" and .error_message != "") then
                . + {ai_suggestion: (
                  if (.error_message | ascii_downcase | test("undefined reference|linker error")) then
                    "**Root Cause:**\nThe linker cannot find the referenced function or symbol. This typically occurs when:\n- A function is declared but not defined\n- Required library is not linked\n- Symbol name mismatch between declaration and definition\n\n**Fix Suggestions:**\n1. Check if the missing symbol is defined in the codebase. Search for the function name.\n2. Verify all required libraries are included in the linker flags (e.g., -lcrypto, -lssl)\n3. Ensure the correct object files are being linked in the build configuration\n\n**Prevention Tips:**\n- Use static analysis tools to catch missing definitions before build\n- Maintain a clear dependency map for external libraries\n- Enable compiler warnings for implicit declarations (-Wimplicit-function-declaration)"
                  elif (.error_message | ascii_downcase | test("dependency|not found")) then
                    "**Root Cause:**\nA required dependency or library cannot be located during the build process. Common causes:\n- Package not installed or incorrect version\n- Incorrect path configuration\n- Missing environment variables\n\n**Fix Suggestions:**\n1. Check if the dependency is listed in your package manager (e.g., requirements.txt, package.json)\n2. Verify the dependency version matches what'\''s expected in your build environment\n3. Review build logs for the exact missing component and install it\n\n**Prevention Tips:**\n- Use dependency lock files (requirements.lock, package-lock.json) to ensure consistent versions\n- Document all required system libraries in README\n- Use containerization (Docker) to ensure reproducible build environments"
                  elif (.error_message | ascii_downcase | test("timeout|timed out")) then
                    "**Root Cause:**\nBuild process exceeded the maximum allowed execution time. This can be caused by:\n- Infinite loops or deadlocks\n- Resource constraints (CPU/memory)\n- Network delays in fetching dependencies\n\n**Fix Suggestions:**\n1. Review recent code changes for potential infinite loops or blocking operations\n2. Check if the build environment has sufficient resources allocated\n3. Optimize build parallelization settings to reduce total build time\n\n**Prevention Tips:**\n- Set up build time monitoring and alerts for anomalies\n- Profile build steps to identify bottlenecks\n- Use build caching to reduce redundant compilation"
                  elif (.error_message | ascii_downcase | test("struct.*no member")) then
                    "**Root Cause:**\nCode is attempting to access a member that doesn'\''t exist in the structure definition. This indicates:\n- Structure definition mismatch between files\n- Incorrect structure version being used\n- Missing or incomplete structure definition\n\n**Fix Suggestions:**\n1. Verify the structure definition includes the member being accessed\n2. Check if there are multiple versions of the structure definition in different headers\n3. Ensure all files are using the same version of the header file\n\n**Prevention Tips:**\n- Use version control for header files and sync across all source files\n- Enable strict compilation warnings (-Werror=incompatible-pointer-types)\n- Document structure changes in changelog"
                  else
                    "**Root Cause:**\nBuild failure detected. Analysis suggests potential issues with:\n- Code compilation or linking\n- Dependency resolution\n- Configuration or environment setup\n\n**Fix Suggestions:**\n1. Review the complete error log to identify the exact failing component\n2. Check recent commits that might have introduced the issue\n3. Verify build environment matches the expected configuration\n4. Try rebuilding after cleaning previous build artifacts\n\n**Prevention Tips:**\n- Run local builds before pushing to ensure changes compile\n- Set up pre-commit hooks to catch common build errors\n- Maintain comprehensive test coverage to catch breaking changes early\n- Document build requirements and dependencies clearly"
                  end
                )}
              else
                .
              end
            ]' "$DASHBOARD_FILE" > "$TEMP_FILE"
            
            # Replace original file with updated version
            mv "$TEMP_FILE" "$DASHBOARD_FILE"
            echo "✅ Added AI suggestions to $DASHBOARD_FILE"
          done
          
          echo "🎉 AI suggestion processing complete"
          
      - name: Commit and push PR list for FXOS
        run: |
          PROJECT_NAME="${{ steps.get-prs.outputs.project_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pr-reports/$PROJECT_NAME/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update $PROJECT_NAME PR list and AI suggestions [$(date -u +"%Y-%m-%d %H:%M:%S UTC")]" && git push)
