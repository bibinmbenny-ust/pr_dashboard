name: Check CI Status

on:
  schedule:
    # Run every 5 minutes (for testing)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

jobs:
  check-ci-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Authenticate with Vault
        id: vault_auth
        run: |
          VAULT_NAMESPACE="${{ secrets.VAULT_NAMESPACE }}"
          if [[ -z "$VAULT_NAMESPACE" ]]; then VAULT_NAMESPACE="firepower/git-emu"; fi
          
          # 1. Login (AppRole)
          echo "Authenticating with Vault..."
          AUTH_RESPONSE=$(curl -s -k -X POST \
            -H "Content-Type: application/json" \
            -H "X-Vault-Namespace: $VAULT_NAMESPACE" \
            -d "{ \"role_id\": \"${{ secrets.VAULT_ROLE_ID }}\", \"secret_id\": \"${{ secrets.VAULT_SECRET_ID }}\" }" \
            "${{ secrets.VAULT_URL }}/v1/auth/approle/login")
          
          if [[ $? -ne 0 ]]; then 
            echo "❌ Curl failed."
            exit 1
          fi
          
          VAULT_TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.auth.client_token // empty')
          
          if [[ -z "$VAULT_TOKEN" ]]; then 
            echo "❌ Auth Failed"
            exit 1
          fi
          
          echo "::add-mask::$VAULT_TOKEN"
          echo "✅ Vault authentication successful"
          
          # 2. Get GitHub PAT (Generic key retrieval)
          echo "Retrieving GitHub PAT from Vault..."
          SECRET_RESPONSE=$(curl -s -k -X GET \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "X-Vault-Namespace: $VAULT_NAMESPACE" \
            "${{ secrets.VAULT_URL }}/v1/test/data/snort3-kv")
          
          GH_PAT=$(echo "$SECRET_RESPONSE" | jq -r '.data.data | to_entries[0].value // empty')
          
          if [[ -z "$GH_PAT" ]]; then 
            echo "❌ PAT not found."
            exit 1
          fi
          
          echo "::add-mask::$GH_PAT"
          echo "✅ GitHub token retrieved from Vault"
          echo "GH_TOKEN=$GH_PAT" >> $GITHUB_ENV

      - name: Get All Open PRs from netsec-fxos-pr-dashboard-poc1
        id: get-prs
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
        run: |
          echo "Fetching all open PRs from cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1"
          
          # First, verify we can access the repository
          if ! gh api repos/cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1 > /dev/null 2>&1; then
            echo "❌ ERROR: Cannot access repository"
            exit 1
          fi
          
          # Get all open pull requests
          PRS_JSON=$(gh api repos/cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1/pulls \
            --jq '[.[] | {
              number: .number,
              title: .title,
              state: .state,
              author: .user.login,
              created_at: .created_at,
              updated_at: .updated_at,
              head_branch: .head.ref,
              base_branch: .base.ref,
              html_url: .html_url,
              draft: .draft,
              mergeable_state: .mergeable_state,
              labels: [.labels[].name]
            }]')
          
          echo "Found PRs:"
          echo "$PRS_JSON" | jq .
          
          PR_COUNT=$(echo "$PRS_JSON" | jq 'length')
          echo "pr_count=$PR_COUNT" >> $GITHUB_OUTPUT
          
          # Create a summary
          echo "## 📋 Open Pull Requests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1" >> $GITHUB_STEP_SUMMARY
          echo "**Total Open PRs:** $PR_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "| PR # | Title | Author | Branch | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY
            
            echo "$PRS_JSON" | jq -r '.[] | "| [#\(.number)](\(.html_url)) | \(.title) | \(.author) | \(.head_branch) → \(.base_branch) | \(.mergeable_state) |"' >> $GITHUB_STEP_SUMMARY
          else
            echo "No open pull requests found." >> $GITHUB_STEP_SUMMARY
          fi
          
          # Save to JSON file
          mkdir -p pr-reports
          echo "$PRS_JSON" > pr-reports/open-prs.json

      - name: Display PR Summary
        run: |
          echo "Total Open PRs: ${{ steps.get-prs.outputs.pr_count }}"
          
          if [ -f pr-reports/open-prs.json ]; then
            echo "PR details saved to pr-reports/open-prs.json"
            cat pr-reports/open-prs.json | jq -r '.[] | "PR #\(.number): \(.title) by \(.author)"'
          fi

      - name: Save PR data with timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg ts "$TIMESTAMP" '. + [{timestamp: $ts}]' pr-reports/open-prs.json > pr-reports/open-prs-timestamped.json
          mv pr-reports/open-prs-timestamped.json pr-reports/open-prs.json
          
      - name: Commit and push PR data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pr-reports/open-prs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update open PRs data from netsec-fxos-pr-dashboard-poc1 [$(date -u +"%Y-%m-%d %H:%M:%S UTC")]" && git push)
