name: Check CI Status

on:
  schedule:
    # Run every 5 minutes (for testing)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

jobs:
  check-ci-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Authenticate with Vault
        id: vault_auth
        run: |
          VAULT_NAMESPACE="${{ secrets.VAULT_NAMESPACE }}"
          if [[ -z "$VAULT_NAMESPACE" ]]; then VAULT_NAMESPACE="firepower/git-emu"; fi
          
          # 1. Login (AppRole)
          echo "Authenticating with Vault..."
          AUTH_RESPONSE=$(curl -s -k -X POST \
            -H "Content-Type: application/json" \
            -H "X-Vault-Namespace: $VAULT_NAMESPACE" \
            -d "{ \"role_id\": \"${{ secrets.VAULT_ROLE_ID }}\", \"secret_id\": \"${{ secrets.VAULT_SECRET_ID }}\" }" \
            "${{ secrets.VAULT_URL }}/v1/auth/approle/login")
          
          if [[ $? -ne 0 ]]; then 
            echo "❌ Curl failed."
            exit 1
          fi
          
          VAULT_TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.auth.client_token // empty')
          
          if [[ -z "$VAULT_TOKEN" ]]; then 
            echo "❌ Auth Failed"
            exit 1
          fi
          
          echo "::add-mask::$VAULT_TOKEN"
          echo "✅ Vault authentication successful"
          
          # 2. Get GitHub PAT (Generic key retrieval)
          echo "Retrieving GitHub PAT from Vault..."
          SECRET_RESPONSE=$(curl -s -k -X GET \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "X-Vault-Namespace: $VAULT_NAMESPACE" \
            "${{ secrets.VAULT_URL }}/v1/test/data/snort3-kv")
          
          GH_PAT=$(echo "$SECRET_RESPONSE" | jq -r '.data.data | to_entries[0].value // empty')
          
          if [[ -z "$GH_PAT" ]]; then 
            echo "❌ PAT not found."
            exit 1
          fi
          
          echo "::add-mask::$GH_PAT"
          echo "✅ GitHub token retrieved from Vault"
          echo "GH_TOKEN=$GH_PAT" >> $GITHUB_ENV

      - name: Check CI Status of netsec-fxos-pr-dashboard-poc1
        id: check-status
        env:
          # Use token from Vault
          GH_TOKEN: ${{ env.GH_TOKEN }}
        run: |
          echo "Checking CI status for cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1"
          
          # First, verify we can access the repository
          if ! gh api repos/cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1 > /dev/null 2>&1; then
            echo "❌ ERROR: Cannot access repository. Please create a Personal Access Token (PAT) with 'repo' scope."
            echo "## ❌ CI Status Check Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Error:** Cannot access repository cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Solution:** Create a PAT with 'repo' scope and add it as 'PAT_TOKEN' secret:" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to GitHub Settings → Developer settings → Personal access tokens → Tokens (classic)" >> $GITHUB_STEP_SUMMARY
            echo "2. Generate new token with 'repo' scope" >> $GITHUB_STEP_SUMMARY
            echo "3. Add it to this repository's secrets as 'PAT_TOKEN'" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          # Get the latest workflow runs
          response=$(gh api repos/cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1/actions/runs \
            --jq '{
              total_count: .total_count,
              latest_run: .workflow_runs[0] | {
                id: .id,
                name: .name,
                status: .status,
                conclusion: .conclusion,
                created_at: .created_at,
                updated_at: .updated_at,
                html_url: .html_url,
                head_branch: .head_branch,
                head_sha: .head_sha
              }
            }')
          
          echo "Response:"
          echo "$response" | jq .
          
          # Extract status and conclusion
          status=$(echo "$response" | jq -r '.latest_run.status')
          conclusion=$(echo "$response" | jq -r '.latest_run.conclusion')
          run_url=$(echo "$response" | jq -r '.latest_run.html_url')
          
          echo "status=$status" >> $GITHUB_OUTPUT
          echo "conclusion=$conclusion" >> $GITHUB_OUTPUT
          echo "run_url=$run_url" >> $GITHUB_OUTPUT
          
          # Create a summary
          echo "## ✅ CI Status Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** $status" >> $GITHUB_STEP_SUMMARY
          echo "**Conclusion:** $conclusion" >> $GITHUB_STEP_SUMMARY
          echo "**Run URL:** $run_url" >> $GITHUB_STEP_SUMMARY

      - name: Display Results
        run: |
          echo "Latest CI Status: ${{ steps.check-status.outputs.status }}"
          echo "Latest CI Conclusion: ${{ steps.check-status.outputs.conclusion }}"
          echo "Run URL: ${{ steps.check-status.outputs.run_url }}"

      - name: Save status to file (optional)
        run: |
          mkdir -p pr-reports
          cat > pr-reports/ci-status.json << EOF
          {
            "repository": "cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1",
            "status": "${{ steps.check-status.outputs.status }}",
            "conclusion": "${{ steps.check-status.outputs.conclusion }}",
            "run_url": "${{ steps.check-status.outputs.run_url }}",
            "checked_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          
      - name: Commit and push status (optional)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pr-reports/ci-status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update CI status from netsec-fxos-pr-dashboard-poc1" && git push)
