name: Check CI Status

on:
  schedule:
    # Run every 5 minutes (for testing)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

jobs:
  check-ci-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Authenticate with Vault
        id: vault_auth
        run: |
          VAULT_NAMESPACE="${{ secrets.VAULT_NAMESPACE }}"
          if [[ -z "$VAULT_NAMESPACE" ]]; then VAULT_NAMESPACE="firepower/git-emu"; fi
          
          # 1. Login (AppRole)
          echo "Authenticating with Vault..."
          AUTH_RESPONSE=$(curl -s -k -X POST \
            -H "Content-Type: application/json" \
            -H "X-Vault-Namespace: $VAULT_NAMESPACE" \
            -d "{ \"role_id\": \"${{ secrets.VAULT_ROLE_ID }}\", \"secret_id\": \"${{ secrets.VAULT_SECRET_ID }}\" }" \
            "${{ secrets.VAULT_URL }}/v1/auth/approle/login")
          
          if [[ $? -ne 0 ]]; then 
            echo "❌ Curl failed."
            exit 1
          fi
          
          VAULT_TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.auth.client_token // empty')
          
          if [[ -z "$VAULT_TOKEN" ]]; then 
            echo "❌ Auth Failed"
            exit 1
          fi
          
          echo "::add-mask::$VAULT_TOKEN"
          echo "✅ Vault authentication successful"
          
          # 2. Get GitHub PAT (Generic key retrieval)
          echo "Retrieving GitHub PAT from Vault..."
          SECRET_RESPONSE=$(curl -s -k -X GET \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "X-Vault-Namespace: $VAULT_NAMESPACE" \
            "${{ secrets.VAULT_URL }}/v1/test/data/snort3-kv")
          
          GH_PAT=$(echo "$SECRET_RESPONSE" | jq -r '.data.data | to_entries[0].value // empty')
          
          if [[ -z "$GH_PAT" ]]; then 
            echo "❌ PAT not found."
            exit 1
          fi
          
          echo "::add-mask::$GH_PAT"
          echo "✅ GitHub token retrieved from Vault"
          echo "GH_TOKEN=$GH_PAT" >> $GITHUB_ENV

      - name: Get All Open PRs from FXOS
        id: get-prs
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
        run: |
          PROJECT_NAME="FXOS"
          REPO_NAME="cisco-netsec-sandbox/netsec-fxos-pr-dashboard-poc1"
          
          echo "Fetching all open PRs from $REPO_NAME"
          
          # First, verify we can access the repository
          if ! gh api repos/$REPO_NAME > /dev/null 2>&1; then
            echo "⚠️ WARNING: Cannot access repository $REPO_NAME"
            echo "[]" > /tmp/empty-prs.json
            echo "pr_count=0" >> $GITHUB_OUTPUT
            mkdir -p pr-reports/$PROJECT_NAME
            echo "[]" > pr-reports/$PROJECT_NAME/pr-list.json
            exit 0
          fi
          
          # Get all open pull requests
          PRS_JSON=$(gh api repos/$REPO_NAME/pulls \
            --jq '[.[] | {
              number: .number,
              title: .title,
              state: .state,
              author: .user.login,
              created_at: .created_at,
              updated_at: .updated_at,
              head_branch: .head.ref,
              head_sha: .head.sha,
              base_branch: .base.ref,
              html_url: .html_url,
              draft: .draft,
              mergeable_state: .mergeable_state,
              labels: [.labels[].name]
            }]')
          
          echo "Found PRs:"
          echo "$PRS_JSON" | jq .
          
          # Fetch CI status for each PR
          PR_COUNT=$(echo "$PRS_JSON" | jq 'length')
          ENRICHED_PRS="[]"
          
          for i in $(seq 0 $((PR_COUNT - 1))); do
            PR=$(echo "$PRS_JSON" | jq ".[$i]")
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            HEAD_SHA=$(echo "$PR" | jq -r '.head_sha')
            
            echo "Fetching CI status for PR #$PR_NUMBER (SHA: $HEAD_SHA)"
            
            # Get commit status
            STATUS_RESPONSE=$(gh api repos/$REPO_NAME/commits/$HEAD_SHA/status || echo '{}')
            CI_STATE=$(echo "$STATUS_RESPONSE" | jq -r '.state // "unknown"')
            
            # Get check runs (GitHub Actions) and determine overall status
            CHECKS_RESPONSE=$(gh api repos/$REPO_NAME/commits/$HEAD_SHA/check-runs || echo '{"check_runs":[]}')
            
            # Check if any check run failed or is in error state
            HAS_FAILURE=$(echo "$CHECKS_RESPONSE" | jq -r '[.check_runs[].conclusion] | any(. == "failure" or . == "error")')
            HAS_PENDING=$(echo "$CHECKS_RESPONSE" | jq -r '[.check_runs[].status] | any(. == "queued" or . == "in_progress")')
            
            # Determine overall check conclusion
            if [ "$HAS_FAILURE" = "true" ]; then
              CHECK_CONCLUSION="failure"
            elif [ "$HAS_PENDING" = "true" ]; then
              CHECK_CONCLUSION="pending"
            else
              CHECK_CONCLUSION=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[0].conclusion // "none"')
            fi
            
            # Overall check status
            CHECK_STATUS=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[0].status // "none"')
            
            # Determine final CI status (prefer commit status, but also consider checks)
            FINAL_STATUS="$CI_STATE"
            if [ "$CI_STATE" = "success" ] && [ "$CHECK_CONCLUSION" = "failure" ]; then
              FINAL_STATUS="failure"
            fi
            
            # AI Analysis for failed builds (using GitHub Models API)
            AI_SUGGESTION=""
            if [ "$FINAL_STATUS" = "failure" ]; then
              echo "🤖 Analyzing failure for PR #$PR_NUMBER with AI..."
              
              # Get PR details for context
              PR_TITLE=$(echo "$PR" | jq -r '.title')
              PR_BRANCH=$(echo "$PR" | jq -r '.head_branch')
              
              # Get recent commit messages for more context
              COMMIT_MESSAGES=$(gh api repos/$REPO_NAME/pulls/$PR_NUMBER/commits --jq '.[].commit.message' | head -5 || echo "No commit messages")
              
              # Get check run details for error messages
              CHECK_ERRORS=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[] | select(.conclusion == "failure") | .name + ": " + .output.title' 2>/dev/null || echo "No detailed error info")
              
              # Create AI prompt
              AI_PROMPT="Analyze this GitHub PR CI failure and provide actionable suggestions:

PR Title: $PR_TITLE
Branch: $PR_BRANCH
Failed Checks: $CHECK_ERRORS
Recent Commits: $COMMIT_MESSAGES

Provide:
1. Likely root cause (2-3 sentences)
2. Specific fix suggestions (2-3 action items)
3. Prevention tips

Be concise and technical."

              # Call GitHub Models API (Copilot)
              # Note: Using GITHUB_TOKEN with GitHub Models endpoint
              AI_RESPONSE=$(curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"model\": \"gpt-4o\",
                  \"messages\": [{\"role\": \"user\", \"content\": $(echo "$AI_PROMPT" | jq -Rs .)}],
                  \"max_tokens\": 500
                }" \
                "https://models.inference.ai.azure.com/chat/completions" 2>/dev/null || echo '{"error": "AI service unavailable"}')
              
              AI_SUGGESTION=$(echo "$AI_RESPONSE" | jq -r '.choices[0].message.content // "AI analysis unavailable"' 2>/dev/null || echo "AI analysis unavailable")
              
              echo "AI Suggestion: $AI_SUGGESTION"
            fi
            
            # Combine PR data with CI status and AI suggestion
            ENRICHED_PR=$(echo "$PR" | jq \
              --arg ci_state "$FINAL_STATUS" \
              --arg check_status "$CHECK_STATUS" \
              --arg check_conclusion "$CHECK_CONCLUSION" \
              --arg ai_suggestion "$AI_SUGGESTION" \
              '. + {ci_status: $ci_state, check_status: $check_status, check_conclusion: $check_conclusion, ai_suggestion: $ai_suggestion}')
            
            ENRICHED_PRS=$(echo "$ENRICHED_PRS" | jq --argjson pr "$ENRICHED_PR" '. + [$pr]')
          done
          
          PRS_JSON="$ENRICHED_PRS"
          echo "Enriched PRs with CI status:"
          echo "$PRS_JSON" | jq .
          
          PR_COUNT=$(echo "$PRS_JSON" | jq 'length')
          echo "pr_count=$PR_COUNT" >> $GITHUB_OUTPUT
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          
          # Create a summary
          echo "## 📋 Open Pull Requests - $PROJECT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** $REPO_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Total Open PRs:** $PR_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "| PR # | Title | Author | Branch | CI Status | Check Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|--------|--------|-----------|--------------|" >> $GITHUB_STEP_SUMMARY
            
            echo "$PRS_JSON" | jq -r '.[] | "| [#\(.number)](\(.html_url)) | \(.title) | \(.author) | \(.head_branch) → \(.base_branch) | \(.ci_status) | \(.check_status) / \(.check_conclusion) |"' >> $GITHUB_STEP_SUMMARY
          else
            echo "No open pull requests found." >> $GITHUB_STEP_SUMMARY
          fi
          
          # Save PR list to project-specific directory
          mkdir -p pr-reports/$PROJECT_NAME
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "$PRS_JSON" | jq --arg ts "$TIMESTAMP" --arg project "$PROJECT_NAME" \
            '{project: $project, timestamp: $ts, repository: "'$REPO_NAME'", total_count: length, pull_requests: .}' \
            > pr-reports/$PROJECT_NAME/pr-list.json

      - name: Display PR Summary for FXOS
        run: |
          PROJECT_NAME="${{ steps.get-prs.outputs.project_name }}"
          echo "=== $PROJECT_NAME ===" 
          echo "Total Open PRs: ${{ steps.get-prs.outputs.pr_count }}"
          
          if [ -f pr-reports/$PROJECT_NAME/pr-list.json ]; then
            echo "PR list saved to pr-reports/$PROJECT_NAME/pr-list.json"
          fi
          
      - name: Commit and push PR list for FXOS
        run: |
          PROJECT_NAME="${{ steps.get-prs.outputs.project_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pr-reports/$PROJECT_NAME/pr-list.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update $PROJECT_NAME PR list [$(date -u +"%Y-%m-%d %H:%M:%S UTC")]" && git push)
