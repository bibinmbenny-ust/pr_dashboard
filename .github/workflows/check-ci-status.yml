name: Check CI Status

on:
  workflow_dispatch: # Manual trigger only

jobs:
  check-ci-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Set GitHub Token
        id: vault_auth
        run: |
          echo "GH_TOKEN=${{ secrets.FXOS_PAT }}" >> $GITHUB_ENV
          echo "✅ GitHub token loaded from Actions secret"

      - name: Get All Open PRs from FXOS
        id: get-prs
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROJECT_NAME="FXOS"
          REPO_NAME="cisco-sbg-emu/netsec-fxos"
          
          echo "Fetching all open PRs from $REPO_NAME"
          
          # First, verify we can access the repository
          if ! gh api repos/$REPO_NAME > /dev/null 2>&1; then
            echo "⚠️ WARNING: Cannot access repository $REPO_NAME"
            echo "[]" > /tmp/empty-prs.json
            echo "pr_count=0" >> $GITHUB_OUTPUT
            mkdir -p pr-reports/$PROJECT_NAME
            echo "[]" > pr-reports/$PROJECT_NAME/pr-list.json
            exit 0
          fi
          
          # Testing mode: only process PRs targeting the specific base branch
          TEST_BRANCH="feature/pr_dashboard_source"
          echo "⚠️ Testing mode: filtering to PRs targeting base branch: $TEST_BRANCH"

          # Get all open pull requests (filtered to PRs whose target/base is TEST_BRANCH)
          PRS_JSON=$(gh api repos/$REPO_NAME/pulls \
            --jq "[.[] | select(.base.ref == \"$TEST_BRANCH\") | {
              number: .number,
              title: .title,
              state: .state,
              author: .user.login,
              created_at: .created_at,
              updated_at: .updated_at,
              head_branch: .head.ref,
              head_sha: .head.sha,
              base_branch: .base.ref,
              html_url: .html_url,
              draft: .draft,
              mergeable_state: .mergeable_state,
              labels: [.labels[].name]
            }]")
          
          echo "Found PRs:"
          echo "$PRS_JSON" | jq .
          
          # Fetch CI status for each PR
          PR_COUNT=$(echo "$PRS_JSON" | jq 'length')
          ENRICHED_PRS="[]"
          
          for i in $(seq 0 $((PR_COUNT - 1))); do
            PR=$(echo "$PRS_JSON" | jq ".[$i]")
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            HEAD_SHA=$(echo "$PR" | jq -r '.head_sha')
            
            echo "Fetching CI status for PR #$PR_NUMBER (SHA: $HEAD_SHA)"
            
            # Get commit status
            STATUS_RESPONSE=$(gh api repos/$REPO_NAME/commits/$HEAD_SHA/status || echo '{}')
            CI_STATE=$(echo "$STATUS_RESPONSE" | jq -r '.state // "unknown"')
            
            # Get check runs (GitHub Actions) and determine overall status
            CHECKS_RESPONSE=$(gh api repos/$REPO_NAME/commits/$HEAD_SHA/check-runs || echo '{"check_runs":[]}')
            
            # Check if any check run failed or is in error state
            HAS_FAILURE=$(echo "$CHECKS_RESPONSE" | jq -r '[.check_runs[].conclusion] | any(. == "failure" or . == "error")')
            HAS_PENDING=$(echo "$CHECKS_RESPONSE" | jq -r '[.check_runs[].status] | any(. == "queued" or . == "in_progress")')
            
            # Determine overall check conclusion
            if [ "$HAS_FAILURE" = "true" ]; then
              CHECK_CONCLUSION="failure"
            elif [ "$HAS_PENDING" = "true" ]; then
              CHECK_CONCLUSION="pending"
            else
              CHECK_CONCLUSION=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[0].conclusion // "none"')
            fi
            
            # Overall check status
            CHECK_STATUS=$(echo "$CHECKS_RESPONSE" | jq -r '.check_runs[0].status // "none"')
            
            # Determine final CI status (prefer commit status, but also consider checks)
            FINAL_STATUS="$CI_STATE"
            if [ "$CI_STATE" = "success" ] && [ "$CHECK_CONCLUSION" = "failure" ]; then
              FINAL_STATUS="failure"
            fi
            
            AI_SUGGESTION=""

            # ── Extract structured check run details for dashboard ──────────
            CHECK_RUNS_DATA=$(echo "$CHECKS_RESPONSE" | jq '[.check_runs[] | {
              name: .name,
              app: (.app.name // ""),
              status: .status,
              conclusion: (.conclusion // "in_progress"),
              started_at: (.started_at // ""),
              completed_at: (.completed_at // ""),
              duration_seconds: (
                if (.started_at != null and .completed_at != null
                    and .started_at != "" and .completed_at != "") then
                  ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor
                else 0 end
              ),
              details_url: (.details_url // ""),
              summary: (.output.summary // "")
            }]')

            # Real CI duration from the Jenkins pre-commit check run (most accurate source)
            JENKINS_CHECK_DURATION=$(echo "$CHECKS_RESPONSE" | jq -r '[
              .check_runs[]
              | select(.name | ascii_downcase | test("jenkins.*pre.*commit|pre.*commit.*workflow|jenkins-pre"))
              | select(.started_at != null and .completed_at != null and .started_at != "")
              | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor
            ] | first // 0')

            # ── GitHub Actions workflow runs (jobs + steps) ───────────────────────
            GH_RUNS_RESP=$(gh api "repos/$REPO_NAME/actions/runs?head_sha=$HEAD_SHA&per_page=20" 2>/dev/null || echo '{"workflow_runs":[]}')
            GH_ACTIONS_FINAL="[]"
            GH_RUN_COUNT=$(echo "$GH_RUNS_RESP" | jq '.workflow_runs | length')
            echo "Found $GH_RUN_COUNT GitHub Actions run(s) for $HEAD_SHA"

            if [ "$GH_RUN_COUNT" -gt 0 ]; then
              for i in $(seq 0 $((GH_RUN_COUNT - 1))); do
                GH_RUN=$(echo "$GH_RUNS_RESP" | jq ".workflow_runs[$i]")
                GH_RUN_ID=$(echo "$GH_RUN" | jq -r '.id')
                GH_RUN_NAME=$(echo "$GH_RUN" | jq -r '.name')
                GH_RUN_NUMBER=$(echo "$GH_RUN" | jq '.run_number')
                GH_RUN_STATUS=$(echo "$GH_RUN" | jq -r '.status')
                GH_RUN_CONCLUSION=$(echo "$GH_RUN" | jq -r '.conclusion // "in_progress"')
                GH_RUN_URL=$(echo "$GH_RUN" | jq -r '.html_url')
                GH_RUN_STARTED=$(echo "$GH_RUN" | jq -r '.run_started_at // ""')
                GH_RUN_UPDATED=$(echo "$GH_RUN" | jq -r '.updated_at // ""')
                GH_RUN_DURATION=0
                if [ -n "$GH_RUN_STARTED" ] && [ -n "$GH_RUN_UPDATED" ] && [ "$GH_RUN_STATUS" = "completed" ]; then
                  S=$(date -d "$GH_RUN_STARTED" +%s 2>/dev/null || echo 0)
                  E=$(date -d "$GH_RUN_UPDATED" +%s 2>/dev/null || echo 0)
                  [ "$E" -gt "$S" ] && GH_RUN_DURATION=$(( E - S ))
                fi

                # Fetch jobs + steps for this run
                JOBS_RESP=$(gh api "repos/$REPO_NAME/actions/runs/$GH_RUN_ID/jobs" 2>/dev/null || echo '{"jobs":[]}')
                JOBS_DATA=$(echo "$JOBS_RESP" | jq '[(.jobs // [])[] | {
                  name: .name,
                  status: .status,
                  conclusion: (.conclusion // "in_progress"),
                  started_at: (.started_at // ""),
                  completed_at: (.completed_at // ""),
                  duration_seconds: (
                    if (.started_at != null and .completed_at != null
                        and .started_at != "" and .completed_at != "") then
                      ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor
                    else 0 end
                  ),
                  url: (.html_url // ""),
                  steps: [(.steps // [])[]
                    | select(.name != "Set up job" and .name != "Complete job") | {
                      name: .name,
                      conclusion: (.conclusion // "in_progress"),
                      number: .number,
                      duration_seconds: (
                        if (.started_at != null and .completed_at != null
                            and .started_at != "" and .completed_at != "") then
                          ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor
                        else 0 end
                      )
                    }]
                }]')

                GH_RUN_ENTRY=$(jq -n \
                  --arg name "$GH_RUN_NAME" \
                  --arg workflow_id "$GH_RUN_ID" \
                  --argjson run_number "$GH_RUN_NUMBER" \
                  --arg status "$GH_RUN_STATUS" \
                  --arg conclusion "$GH_RUN_CONCLUSION" \
                  --arg url "$GH_RUN_URL" \
                  --arg started_at "$GH_RUN_STARTED" \
                  --argjson duration_seconds "$GH_RUN_DURATION" \
                  --argjson jobs "$JOBS_DATA" \
                  '{name: $name, workflow_id: $workflow_id, run_number: $run_number,
                    status: $status, conclusion: $conclusion, url: $url,
                    started_at: $started_at, duration_seconds: $duration_seconds,
                    jobs: $jobs}')
                GH_ACTIONS_FINAL=$(echo "$GH_ACTIONS_FINAL" | jq --argjson e "$GH_RUN_ENTRY" '. + [$e]')
              done
            fi

            # ── Generate dashboard_<PR>.json from Jenkins banner comments ──
            PR_TITLE=$(echo "$PR" | jq -r '.title')
            PR_AUTHOR=$(echo "$PR" | jq -r '.author')
            PR_CREATED=$(echo "$PR" | jq -r '.created_at')
            PR_UPDATED=$(echo "$PR" | jq -r '.updated_at')
            PR_HEAD_BRANCH=$(echo "$PR" | jq -r '.head_branch')
            PR_BASE_BRANCH=$(echo "$PR" | jq -r '.base_branch')
            COMMIT_HASH=$(echo "$PR" | jq -r '.head_sha')
            JENKINS_JOB_URL="https://engci-private-rtp.cisco.com/jenkins/firepower-precommit-asa-fxos/job/Precommit/job/FXOS/job/FXOS-GIT/job/Precommit-BAZEL/job/PR-${PR_NUMBER}"

            # Extra PR detail
            PR_DETAIL=$(gh api repos/$REPO_NAME/pulls/$PR_NUMBER || echo '{}')
            CHANGED_FILES_COUNT=$(echo "$PR_DETAIL" | jq '.changed_files // 0')
            ADDITIONS=$(echo "$PR_DETAIL" | jq '.additions // 0')
            DELETIONS=$(echo "$PR_DETAIL" | jq '.deletions // 0')
            MERGED=$(echo "$PR_DETAIL" | jq '.merged // false')

            # Changed files with diff patches
            FILES_RESP=$(gh api repos/$REPO_NAME/pulls/$PR_NUMBER/files || echo '[]')
            CHANGED_FILES_DETAILS=$(echo "$FILES_RESP" | jq '[.[] | {
              file_name: .filename, status: .status,
              additions: .additions, deletions: .deletions,
              changes: .changes, patch: (.patch // "")
            }]')

            # ── PR Review analytics ───────────────────────────────────────
            # Line-level code review comments (threads on diff hunks)
            REVIEW_COMMENTS=$(gh api "repos/$REPO_NAME/pulls/$PR_NUMBER/comments?per_page=100" 2>/dev/null || echo '[]')
            # Formal reviews (APPROVE / CHANGES_REQUESTED / COMMENT)
            PR_REVIEWS=$(gh api "repos/$REPO_NAME/pulls/$PR_NUMBER/reviews" 2>/dev/null || echo '[]')

            REVIEW_STATS=$(jq -n \
              --arg author "$PR_AUTHOR" \
              --argjson rc "$REVIEW_COMMENTS" \
              --argjson rv "$PR_REVIEWS" \
              '{
                total_review_comments:       ($rc | length),
                copilot_comments:            ($rc | [.[] | select(.user.login | ascii_downcase | test("copilot"))] | length),
                copilot_addressed:           ($rc | [.[] | select((.user.login | ascii_downcase | test("copilot")) and .position == null)] | length),
                copilot_open:                ($rc | [.[] | select((.user.login | ascii_downcase | test("copilot")) and .position != null)] | length),
                human_reviewer_comments:     ($rc | [.[] | select(.user.type != "Bot" and .user.login != $author)] | length),
                author_replies:              ($rc | [.[] | select(.user.login == $author and .in_reply_to_id != null)] | length),
                author_own_comments:         ($rc | [.[] | select(.user.login == $author and .in_reply_to_id == null)] | length),
                outdated_threads:            ($rc | [.[] | select(.position == null)] | length),
                reviews_approved:            ($rv | [.[] | select(.state == "APPROVED")] | length),
                reviews_changes_requested:   ($rv | [.[] | select(.state == "CHANGES_REQUESTED")] | length),
                reviews_commented:           ($rv | [.[] | select(.state == "COMMENTED")] | length),
                unique_reviewers:            ($rv | [.[] | select(.user.type != "Bot") | .user.login] | unique | length),
                engagement_score: (
                  if ($rc | length) == 0 then 100
                  else
                    ((
                      ($rc | [.[] | select(.position == null)] | length) +
                      ($rc | [.[] | select(.user.login == $author and .in_reply_to_id != null)] | length)
                    ) * 100 / ($rc | length)) | floor | [100, .] | min
                  end
                )
              }')

            DASH_FILE="pr-reports/$PROJECT_NAME/dashboard_${PR_NUMBER}.json"
            [ -f "$DASH_FILE" ] || echo "[]" > "$DASH_FILE"

            # Fetch all PR comments and filter to Jenkins banner comments
            ALL_COMMENTS=$(gh api repos/$REPO_NAME/issues/$PR_NUMBER/comments || echo '[]')
            BANNERS=$(echo "$ALL_COMMENTS" | jq '[.[] | select(.body | contains("FXOS Pre-Commit CI Pipeline"))]')
            BANNER_COUNT=$(echo "$BANNERS" | jq 'length')
            echo "Found $BANNER_COUNT banner comment(s) for PR #$PR_NUMBER"

            for b in $(seq 0 $((BANNER_COUNT - 1))); do
              BANNER=$(echo "$BANNERS" | jq ".[$b]")
              COMMENT_ID=$(echo "$BANNER" | jq -r '.id | tostring')
              BANNER_BODY=$(echo "$BANNER" | jq -r '.body')
              BANNER_CREATED=$(echo "$BANNER" | jq -r '.created_at')

              # Deduplicate by GitHub comment ID
              ALREADY=$(jq --arg cid "$COMMENT_ID" \
                '[.[] | select((.banner_comment_id // "") | tostring == $cid)] | length' "$DASH_FILE")
              if [ "$ALREADY" -gt 0 ]; then
                echo "    Banner $COMMENT_ID already recorded, skipping"
                continue
              fi

              # ── Parse banner fields ────────────────────────────────────────
              # Build number → use as revision number
              BUILD_NUM=$(echo "$BANNER_BODY" | grep -oP 'Build #\K\d+' | head -1 || echo "")
              if [ -z "$BUILD_NUM" ]; then
                BUILD_NUM=$(jq 'if length == 0 then 1 else ([.[].revision] | max + 1) end' "$DASH_FILE")
              fi
              JENKINS_BUILD_URL="${JENKINS_JOB_URL}/${BUILD_NUM}/"

              # CI start time from banner timestamp
              CI_START_RAW=$(echo "$BANNER_BODY" | grep -oP '⏰ \*\*\K[^*]+' | head -1 || echo "")
              if [ -n "$CI_START_RAW" ]; then
                CI_START_TIME=$(date -d "$CI_START_RAW" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "$BANNER_CREATED")
              else
                CI_START_TIME="$BANNER_CREATED"
              fi

              # CI duration: Jenkins posts the banner on build completion, so
              # BANNER_CREATED ≈ build end time and ⏰ timestamp = build start time
              CI_DURATION=0
              if [ -n "$CI_START_RAW" ]; then
                START_EPOCH=$(date -d "$CI_START_TIME" +%s 2>/dev/null || echo 0)
                END_EPOCH=$(date -d "$BANNER_CREATED" +%s 2>/dev/null || echo 0)
                if [ "$END_EPOCH" -gt "$START_EPOCH" ]; then
                  CI_DURATION=$(( END_EPOCH - START_EPOCH ))
                fi
              fi
              # Fall back to Jenkins GitHub check run timing if banner timing unavailable
              if [ "$CI_DURATION" -eq 0 ] && [ "${JENKINS_CHECK_DURATION:-0}" -gt 0 ]; then
                CI_DURATION="$JENKINS_CHECK_DURATION"
              fi

              # Unit Tests status (from <summary> line icon)
              UT_STATUS="N/A"
              if echo "$BANNER_BODY" | grep -qP 'Unit Tests ✅'; then UT_STATUS="SUCCESS"
              elif echo "$BANNER_BODY" | grep -qP 'Unit Tests ❌'; then UT_STATUS="FAILURE"
              fi

              # UT detail metrics
              UT_COVERAGE=$(echo "$BANNER_BODY" | grep -oP '\*\*Coverage\*\* \| 📊 \*\*\K[^*]+' | head -1 || echo "N/A")
              UT_PASSED=$(echo "$BANNER_BODY"  | grep -oP '\*\*Passed\*\* \|[^|]+\*\*\K\d+(?=\*\*)' | head -1 || echo "0")
              UT_FAILED=$(echo "$BANNER_BODY"  | grep -oP '\*\*Failed\*\* \|[^|]+\*\*\K\d+(?=\*\*)' | head -1 || echo "0")
              UT_SKIPPED=$(echo "$BANNER_BODY" | grep -oP '\*\*Skipped\*\* \|[^|]+\*\*\K\d+(?=\*\*)' | head -1 || echo "0")

              # Initialise MODULE_METRICS with UT fields
              MODULE_METRICS=$(jq -n \
                --arg uts "$UT_STATUS" --arg cov "$UT_COVERAGE" \
                --arg passed "$UT_PASSED" --arg failed "$UT_FAILED" --arg skipped "$UT_SKIPPED" \
                '{"Unit Tests: Build Status": $uts,
                  "Unit Tests: Coverage Percentage": $cov,
                  "Unit Tests: Unit Tests Passed": $passed,
                  "Unit Tests: Unit Tests Failed": $failed,
                  "Unit Tests: Unit Tests Skipped": $skipped}')

              FAILED_STAGES=""
              TOTAL_FAILURES=0
              DASH_ERRORS="[]"
              DASH_ERROR_MSG=""

              # Parse module table rows: | **MODULE** | emoji STATUS | emoji N |
              while IFS= read -r line; do
                MOD=$(echo "$line" | grep -oP '(?<=\| \*\*)[^*]+(?=\*\*)')
                [ -z "$MOD" ] && continue
                # Skip UT metric rows (Status, Coverage, Passed, etc.)
                echo "$MOD" | grep -qiP '^(Status|Coverage|Passed|Failed|Skipped|Module|Metric|SA Issues)$' && continue

                SA_ISSUES=$(echo "$line" | grep -oP '\d+' | tail -1 || echo "0")

                if echo "$line" | grep -qP '✅.*(SUCCESS|\[SUCCESS\])'; then
                  MOD_STATUS="SUCCESS"
                elif echo "$line" | grep -qP '❌'; then
                  MOD_STATUS="FAILURE"
                  TOTAL_FAILURES=$((TOTAL_FAILURES + 1))
                  FAILED_STAGES="${FAILED_STAGES:+$FAILED_STAGES, }$MOD"
                  ERR_URL=$(echo "$line" | grep -oP '\[FAILURE\]\(\K[^)]+' || echo "$JENKINS_BUILD_URL")
                  ERR_ENTRY=$(jq -n --arg s "$MOD" --arg u "$ERR_URL" \
                    '{stage: $s, status: "FAILURE", error_log_url: $u, stage_type: "build", error_count: 0, error_preview: "Build failed - check logs", has_full_details: false}')
                  DASH_ERRORS=$(echo "$DASH_ERRORS" | jq --argjson e "$ERR_ENTRY" '. + [$e]')
                  DASH_ERROR_MSG="${DASH_ERROR_MSG:+$DASH_ERROR_MSG\n}❌ $MOD: build failed"
                else
                  continue
                fi

                MODULE_METRICS=$(echo "$MODULE_METRICS" | jq \
                  --arg k "${MOD}: Build Status" --arg v "$MOD_STATUS" \
                  --arg sk "${MOD}: Static Analysis Issues" --argjson sv "${SA_ISSUES:-0}" \
                  '. + {($k): $v, ($sk): $sv}')
              done < <(echo "$BANNER_BODY" | grep -P '^\| \*\*')

              # Assemble dashboard entry
              DASH_ENTRY=$(echo "$MODULE_METRICS" | jq \
                --arg title "$PR_TITLE" \
                --argjson changed_files "$CHANGED_FILES_COUNT" \
                --argjson additions "$ADDITIONS" \
                --argjson deletions "$DELETIONS" \
                --argjson merged "$MERGED" \
                --arg pr_id "$PR_NUMBER" \
                --arg author "$PR_AUTHOR" \
                --arg created_at "$PR_CREATED" \
                --arg updated_at "$PR_UPDATED" \
                --arg pr_state "open" \
                --arg base_branch "$PR_BASE_BRANCH" \
                --arg head_branch "$PR_HEAD_BRANCH" \
                --arg commit_hash "$COMMIT_HASH" \
                --arg ci_start_time "$CI_START_TIME" \
                --argjson ci_duration "$CI_DURATION" \
                --arg jenkins_build_number "$BUILD_NUM" \
                --arg jenkins_build_url "$JENKINS_BUILD_URL" \
                --argjson total_failures "$TOTAL_FAILURES" \
                --arg failed_stage "$FAILED_STAGES" \
                --argjson errors "$DASH_ERRORS" \
                --arg error_message "$DASH_ERROR_MSG" \
                --argjson changed_files_details "$CHANGED_FILES_DETAILS" \
                --argjson revision "$BUILD_NUM" \
                --arg banner_comment_id "$COMMENT_ID" \
                --arg ai_suggestion "" \
                --argjson check_runs "$CHECK_RUNS_DATA" \
                --argjson review_stats "$REVIEW_STATS" \
                --argjson github_actions_runs "$GH_ACTIONS_FINAL" \
                '. + {
                  title: $title, changed_files: $changed_files, additions: $additions,
                  deletions: $deletions, merged: $merged, pr_id: $pr_id, author: $author,
                  created_at: $created_at, updated_at: $updated_at, pr_state: $pr_state,
                  base_branch: $base_branch, head_branch: $head_branch, commit_hash: $commit_hash,
                  ci_start_time: $ci_start_time, ci_duration_seconds: $ci_duration,
                  jenkins_build_number: $jenkins_build_number, jenkins_build_url: $jenkins_build_url,
                  total_failures: $total_failures, failed_stage: $failed_stage,
                  errors: $errors, error_message: $error_message,
                  changed_files_details: $changed_files_details,
                  revision: ($revision | tonumber),
                  banner_comment_id: ($banner_comment_id | tonumber),
                  ai_suggestion: $ai_suggestion,
                  check_runs: $check_runs,
                  review_stats: $review_stats,
                  github_actions_runs: $github_actions_runs
                }')

              jq --argjson entry "$DASH_ENTRY" '. + [$entry]' "$DASH_FILE" > /tmp/dash_tmp.json
              mv /tmp/dash_tmp.json "$DASH_FILE"
              echo "✅ Revision $BUILD_NUM (comment $COMMENT_ID) → dashboard_${PR_NUMBER}.json"
            done
            echo "dashboard_${PR_NUMBER}.json now has $(jq 'length' "$DASH_FILE") revision(s)"
            # ── End dashboard file ─────────────────────────────────────────

            # Combine PR data with CI status and AI suggestion
            ENRICHED_PR=$(echo "$PR" | jq \
              --arg ci_state "$FINAL_STATUS" \
              --arg check_status "$CHECK_STATUS" \
              --arg check_conclusion "$CHECK_CONCLUSION" \
              --arg ai_suggestion "$AI_SUGGESTION" \
              '. + {ci_status: $ci_state, check_status: $check_status, check_conclusion: $check_conclusion, ai_suggestion: $ai_suggestion}')
            
            ENRICHED_PRS=$(echo "$ENRICHED_PRS" | jq --argjson pr "$ENRICHED_PR" '. + [$pr]')
          done
          
          PRS_JSON="$ENRICHED_PRS"
          echo "Enriched PRs with CI status:"
          echo "$PRS_JSON" | jq .
          
          PR_COUNT=$(echo "$PRS_JSON" | jq 'length')
          echo "pr_count=$PR_COUNT" >> $GITHUB_OUTPUT
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          
          # Create a summary
          echo "## 📋 Open Pull Requests - $PROJECT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** $REPO_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Total Open PRs:** $PR_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "| PR # | Title | Author | Branch | CI Status | Check Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|--------|--------|-----------|--------------|" >> $GITHUB_STEP_SUMMARY
            
            echo "$PRS_JSON" | jq -r '.[] | "| [#\(.number)](\(.html_url)) | \(.title) | \(.author) | \(.head_branch) → \(.base_branch) | \(.ci_status) | \(.check_status) / \(.check_conclusion) |"' >> $GITHUB_STEP_SUMMARY
          else
            echo "No open pull requests found." >> $GITHUB_STEP_SUMMARY
          fi
          
          # Save PR list to project-specific directory
          mkdir -p pr-reports/$PROJECT_NAME
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "$PRS_JSON" | jq --arg ts "$TIMESTAMP" --arg project "$PROJECT_NAME" --arg repo "$REPO_NAME" \
            '{project: $project, timestamp: $ts, repository: $repo, total_count: length, pull_requests: .}' \
            > pr-reports/$PROJECT_NAME/pr-list.json

      - name: Display PR Summary for FXOS
        run: |
          PROJECT_NAME="${{ steps.get-prs.outputs.project_name }}"
          echo "=== $PROJECT_NAME ===" 
          echo "Total Open PRs: ${{ steps.get-prs.outputs.pr_count }}"
          
          if [ -f pr-reports/$PROJECT_NAME/pr-list.json ]; then
            echo "PR list saved to pr-reports/$PROJECT_NAME/pr-list.json"
          fi
          
      - name: Commit and push PR list for FXOS
        run: |
          PROJECT_NAME="${{ steps.get-prs.outputs.project_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pr-reports/$PROJECT_NAME/
          
          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Commit changes
          git commit -m "Update $PROJECT_NAME PR list [$(date -u +"%Y-%m-%d %H:%M:%S UTC")]"
          
          # Pull with rebase to avoid conflicts, then push
          git pull --rebase origin main || {
            echo "Rebase failed, trying to continue..."
            git rebase --abort
            git pull --no-rebase origin main
            git push origin main
            exit 0
          }
          
          git push origin main
